name: Firebase Rules Security Tests

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: firebase-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    name: Firestore and Storage rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: firebase_rules_tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase_rules_tests/package-lock.json

      - name: Set up Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install rules test dependencies
        run: npm ci

      - name: Run Firestore and Storage rules tests
        run: npm test
        env:
          CI: true
